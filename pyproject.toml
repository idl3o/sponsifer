[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sponsifer"
dynamic = ["version"]
description = "Price a sponsorship and defend the number, put the sponsor on stream through OBS, sign a report of when it was on air, and seal what you deliver. Local-first, no account, no telemetry."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S. Lavi" }]
requires-python = ">=3.10"
keywords = ["creator-economy", "sponsorship", "rate-card", "media-kit", "obs", "twitch", "streaming", "c2pa", "watermark", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
]
# The base install is the OBS toolkit: the app, the overlays, the dock, the
# logger and the signed report. Signing needs cryptography; the logger needs
# OBS's WebSocket. Nothing else, so a streamer does not install an imaging
# stack to log a stream. `test_imports.py` and CI's python-base job hold it.
dependencies = [
  "cryptography>=42",
  # OBS's WebSocket, for the on-air log. Pure Python, no build step.
  "websockets>=13",
]

[project.optional-dependencies]
# Sealing and verifying a delivered file. TrustMark pulls in PyTorch, several
# hundred megabytes; the rest read images, write C2PA and ask a timestamp
# authority, which only `seal` and `verify` do.
seal = ["trustmark>=0.9.2", "pillow>=10", "imagehash>=4.3", "c2pa-python>=0.37", "rfc3161ng>=2.1"]
# The seal extra without TrustMark: the tests fake the watermark, so CI never
# installs PyTorch.
dev = ["pytest>=8", "markdown>=3.5", "pillow>=10", "imagehash>=4.3", "c2pa-python>=0.37", "rfc3161ng>=2.1"]

[project.scripts]
sponsifer = "sponsifer.cli:main"

[project.urls]
Homepage = "https://github.com/idl3o/sponsifer"
Documentation = "https://github.com/idl3o/sponsifer/blob/main/docs/provenance.md"
Issues = "https://github.com/idl3o/sponsifer/issues"
Source = "https://github.com/idl3o/sponsifer"

# One version, in one place: the tag, the package and `sponsifer --version`
# cannot disagree. The release workflow refuses a tag that does not match.
[tool.hatch.version]
path = "python/sponsifer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/sponsifer"]
# The built web app is gitignored, so it has to be named to be included.
artifacts = ["python/sponsifer/web/**"]

[tool.hatch.build.targets.sdist]
include = ["python/sponsifer", "python/tests", "README.md", "LICENSE"]
artifacts = ["python/sponsifer/web/**"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
