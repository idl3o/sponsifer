# Build, test and publish the `sponsifer` package with PyPI Trusted
# Publishing: GitHub proves to PyPI, over OIDC, that this workflow in this
# repository made the upload, so no API token exists to leak. PyPI attaches a
# Sigstore-signed attestation to every file it receives this way.
#
#   Run manually (Actions > release > Run workflow)  ->  TestPyPI only
#   Push a tag vX.Y.Z matching the package version   ->  TestPyPI, then PyPI
#
# The `pypi` environment should require your approval in the repository
# settings, so no tag can publish without a click. See docs/RELEASING.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit, with its version beside it: a tag can be
# moved, and the publish jobs hold `id-token: write`. Resolve a new pin from the
# action's release, and leave a release a week before taking it.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bundle

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install . pytest
      - run: python -m pytest

      - name: Tag, package and app versions agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('python/sponsifer/__init__.py').read_text()).group(1))")
          js=$(node -p "require('./package.json').version")
          echo "tag $tag, python $py, app $js"
          test "$tag" = "$py" && test "$tag" = "$js"

      # `npm run bundle` left the web build in dist/, so the Python build gets a
      # directory of its own: twine refuses anything there that is not a package.
      - run: python -m build --outdir python/dist
      - run: python -m twine check --strict python/dist/*
      - name: The wheel carries the app
        run: python -m zipfile -l python/dist/*.whl | grep -q "sponsifer/web/index.html"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: python/dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sponsifer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A manual run may already have put this version on TestPyPI.
          skip-existing: true

  pypi:
    needs: testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sponsifer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
